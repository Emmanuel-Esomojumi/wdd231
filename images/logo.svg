<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- shared central spine -->
  <rect x="18" y="3" width="4" height="34" rx="2" fill="#14192B"/>
  <!-- left E: arms extend left from the spine -->
  <rect x="4" y="3" width="14" height="6" rx="2" fill="#14192B"/>
  <rect x="4" y="17" width="14" height="6" rx="2" fill="#14192B"/>
  <rect x="4" y="31" width="14" height="6" rx="2" fill="#14192B"/>
  <!-- right E (mirrored): arms extend right from the spine, same heights -->
  <rect x="22" y="3" width="14" height="6" rx="2" fill="#14192B"/>
  <rect x="22" y="17" width="14" height="6" rx="2" fill="#14192B"/>
  <rect x="22" y="31" width="14" height="6" rx="2" fill="#14192B"/>
</svg>
